{{- if eq (include "aegis.createSecret" .) "true" }}
# Rendered only when secrets.existingSecret is empty and at least one literal is
# set. Prefer secrets.existingSecret in production.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis.labels" (dict "root" $ "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  AEGIS_LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  AEGIS_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  AEGIS_REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  AEGIS_API_KEYS: {{ .Values.secrets.apiKeys | quote }}
{{- end }}
