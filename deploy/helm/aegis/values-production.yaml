# Production values. Layer on top of values.yaml:
#   helm upgrade --install aegis deploy/helm/aegis -n aegis --create-namespace \
#     -f deploy/helm/aegis/values-production.yaml \
#     --set image.tag=sha-<commit> --set web.image.tag=sha-<commit>
#
# Stateful dependencies are managed services (RDS/Cloud SQL with pgvector,
# ElastiCache/Memorystore, Temporal Cloud or a dedicated Temporal cluster).
# Their URLs live in the pre-created Secret named below - nothing stateful is
# deployed by this chart in production.

image:
  repository: ghcr.io/example-org/aegis/aegis
  tag: "" # --set image.tag=sha-<commit> from CI
  pullPolicy: IfNotPresent

config:
  environment: production
  logLevel: INFO
  temporal:
    # Temporal Cloud: "<namespace>.<account>.tmprl.cloud:7233"
    address: temporal-frontend.temporal.svc.cluster.local:7233
    namespace: aegis
  # The infrastructure gateway Aegis observes and acts on; /ready checks it.
  simulatorUrl: http://infra-gateway.aegis-infra.svc.cluster.local:8601
  telemetryProvider: simulator # or prometheus + prometheusUrl
  prometheusUrl: http://prometheus-operated.monitoring.svc.cluster.local:9090
  otel:
    enabled: true
    exporterEndpoint: http://otel-collector.monitoring.svc.cluster.local:4317
  api:
    authMode: api_key # mandatory in production
    corsOrigins:
      - https://aegis.example.com
    publicUrl: https://api.aegis.example.com
  database:
    poolSize: 20
    maxOverflow: 10

secrets:
  # Created out-of-band (kubectl / External Secrets Operator / sealed-secrets):
  #   kubectl -n aegis create secret generic aegis-secrets \
  #     --from-literal=AEGIS_LLM_API_KEY=... --from-literal=AEGIS_DATABASE_URL=... \
  #     --from-literal=AEGIS_REDIS_URL=... --from-literal=AEGIS_API_KEYS=...
  existingSecret: aegis-secrets

api:
  replicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: api

worker:
  replicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  pdb:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: worker

detector:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

simulator:
  enabled: false

web:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/example-org/aegis/web
    tag: ""
  # Must match the build args the image was produced with (NEXT_PUBLIC_* are inlined).
  env:
    NEXT_PUBLIC_AEGIS_API_URL: https://api.aegis.example.com
    NEXT_PUBLIC_TEMPORAL_UI_URL: https://temporal.example.com
    NEXT_PUBLIC_GRAFANA_URL: https://grafana.example.com
    NEXT_PUBLIC_PROMETHEUS_URL: https://prometheus.example.com
    NEXT_PUBLIC_TEMPORAL_NAMESPACE: aegis
    NEXT_TELEMETRY_DISABLED: "1"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  api:
    host: api.aegis.example.com
  web:
    host: aegis.example.com
  tls:
    enabled: true
    secretName: aegis-tls

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  podMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

devInfra:
  enabled: false
