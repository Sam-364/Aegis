# Detection loop: polls telemetry, opens incidents, starts workflows.
# Holds a Redis leader lock ("detector-leader"), so extra replicas are safe
# standbys - but one is enough.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: detector
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis
      app.kubernetes.io/component: detector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis
        app.kubernetes.io/component: detector
    spec:
      serviceAccountName: aegis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: detector
          image: aegis/aegis
          imagePullPolicy: IfNotPresent
          command: ["aegis-detector"]
          ports:
            - name: metrics
              containerPort: 9465
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aegis-config
          env:
            - name: AEGIS_METRICS_PORT
              value: "9465"
            # The detector never calls the LLM; keep the key out of this pod.
            - name: AEGIS_LLM_PROVIDER
              value: disabled
            - name: AEGIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aegis-secrets
                  key: AEGIS_DATABASE_URL
            - name: AEGIS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aegis-secrets
                  key: AEGIS_REDIS_URL
          startupProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
