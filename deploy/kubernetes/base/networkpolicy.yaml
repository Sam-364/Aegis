# Ingress is denied by default for every pod in the namespace; only the paths
# below are opened. Egress is left open (LLM API, managed Postgres/Redis/Temporal).
#
# Assumptions (adjust per cluster):
#   * ingress-nginx runs in a namespace labelled kubernetes.io/metadata.name=ingress-nginx
#   * Prometheus runs in a namespace labelled kubernetes.io/metadata.name=monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/name: aegis
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  labels:
    app.kubernetes.io/name: aegis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aegis
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # ingress controller
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        # console server-side calls (AEGIS_API_URL)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aegis
              app.kubernetes.io/component: web
        # metrics scrape of /metrics
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8600
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web
  labels:
    app.kubernetes.io/name: aegis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aegis
      app.kubernetes.io/component: web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  labels:
    app.kubernetes.io/name: aegis
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["worker", "detector"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9464
          protocol: TCP
        - port: 9465
          protocol: TCP
