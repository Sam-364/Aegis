# TEMPLATE ONLY - not applied by any kustomization.
#
# The `aegis-secrets` Secret must exist in the `aegis` namespace before the
# Deployments and the migrate Job can start. Create it out-of-band:
#
#   kubectl -n aegis create secret generic aegis-secrets \
#     --from-literal=AEGIS_LLM_API_KEY='sk-...' \
#     --from-literal=AEGIS_DATABASE_URL='postgresql+asyncpg://user:pass@host:5432/aegis' \
#     --from-literal=AEGIS_REDIS_URL='rediss://:pass@host:6379/0' \
#     --from-literal=AEGIS_API_KEYS='k1:admin:oncall,k2:viewer:dashboard'
#
# ...or let External Secrets Operator sync it from your secret store - see
# overlays/production/externalsecret.example.yaml.
#
# Keys:
#   AEGIS_LLM_API_KEY  - OpenAI (or compatible) key. Optional when
#                        AEGIS_LLM_PROVIDER=disabled|scripted.
#   AEGIS_DATABASE_URL - SQLAlchemy asyncpg URL to a pgvector-enabled Postgres.
#   AEGIS_REDIS_URL    - redis:// or rediss:// URL.
#   AEGIS_API_KEYS     - "key:role[:name],..." roles: admin|operator|viewer.
#                        Required when AEGIS_API_AUTH_MODE=api_key (production).
apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/part-of: aegis
type: Opaque
stringData:
  AEGIS_LLM_API_KEY: "CHANGE_ME"
  AEGIS_DATABASE_URL: "postgresql+asyncpg://aegis:CHANGE_ME@postgres.example.internal:5432/aegis"
  AEGIS_REDIS_URL: "rediss://:CHANGE_ME@redis.example.internal:6379/0"
  AEGIS_API_KEYS: "CHANGE_ME:admin:oncall"
