# The worker has no Service (it receives no traffic); scrape pods directly.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: aegis-worker
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis
      app.kubernetes.io/component: worker
  namespaceSelector:
    matchNames: ["aegis"]
  podMetricsEndpoints:
    - port: metrics # 9464
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
