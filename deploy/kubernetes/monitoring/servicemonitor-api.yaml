apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aegis-api
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis
      app.kubernetes.io/component: api
  namespaceSelector:
    matchNames: ["aegis"]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
