# Example: sync `aegis-secrets` from an external store with External Secrets
# Operator (https://external-secrets.io). Requires a ClusterSecretStore named
# `aegis-store` (AWS Secrets Manager, Vault, GCP SM, ...). Uncomment it in
# kustomization.yaml once ESO is installed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aegis-secrets
  labels:
    app.kubernetes.io/name: aegis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aegis-store
  target:
    name: aegis-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: AEGIS_LLM_API_KEY
      remoteRef:
        key: aegis/production/llm
        property: api_key
    - secretKey: AEGIS_DATABASE_URL
      remoteRef:
        key: aegis/production/postgres
        property: url
    - secretKey: AEGIS_REDIS_URL
      remoteRef:
        key: aegis/production/redis
        property: url
    - secretKey: AEGIS_API_KEYS
      remoteRef:
        key: aegis/production/api
        property: keys
