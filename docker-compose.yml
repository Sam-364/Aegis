# Aegis local environment.
#   docker compose up --build            -> core spine (postgres, redis, temporal, simulator, api, worker, detector, web)
#   docker compose --profile observability up -> adds prometheus, grafana, tempo, loki, promtail, otel-collector
name: aegis

x-aegis-env: &aegis-env
  AEGIS_ENVIRONMENT: ${AEGIS_ENVIRONMENT:-development}
  AEGIS_LOG_LEVEL: ${AEGIS_LOG_LEVEL:-INFO}
  AEGIS_LOG_FORMAT: json
  AEGIS_DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
  AEGIS_REDIS_URL: redis://redis:6379/0
  AEGIS_TEMPORAL_ADDRESS: temporal:7233
  AEGIS_TEMPORAL_NAMESPACE: default
  AEGIS_SIMULATOR_URL: http://simulator:8601
  AEGIS_TELEMETRY_PROVIDER: ${AEGIS_TELEMETRY_PROVIDER:-simulator}
  AEGIS_PROMETHEUS_URL: http://prometheus:9090
  AEGIS_LLM_PROVIDER: ${AEGIS_LLM_PROVIDER:-openai}
  AEGIS_LLM_API_KEY: ${AEGIS_LLM_API_KEY:-}
  AEGIS_LLM_API_KEY_FILE: /run/secrets/openai_api_key
  AEGIS_LLM_REASONER_MODEL: ${AEGIS_LLM_REASONER_MODEL:-gpt-5-mini}
  AEGIS_LLM_FAST_MODEL: ${AEGIS_LLM_FAST_MODEL:-gpt-5-nano}
  AEGIS_LLM_REASONING_EFFORT: ${AEGIS_LLM_REASONING_EFFORT:-low}
  AEGIS_OTEL_ENABLED: ${AEGIS_OTEL_ENABLED:-false}
  AEGIS_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
  AEGIS_API_AUTH_MODE: ${AEGIS_API_AUTH_MODE:-disabled}
  AEGIS_API_KEYS: ${AEGIS_API_KEYS:-}
  AEGIS_API_CORS_ORIGINS: '["http://localhost:3600","http://127.0.0.1:3600"]'
  AEGIS_APPROVAL_TIMEOUT_SECONDS: ${AEGIS_APPROVAL_TIMEOUT_SECONDS:-900}
  AEGIS_DETECTION_INTERVAL_SECONDS: ${AEGIS_DETECTION_INTERVAL_SECONDS:-5}

secrets:
  openai_api_key:
    file: ${OPENAI_API_KEY_FILE:-./.secrets/openai_api_key}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redis-data:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: aegis
      POSTGRES_PWD: aegis
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      ENABLE_ES: "false"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  temporal-ui:
    image: temporalio/ui:2.32.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3600
    ports: ["8233:8080"]

  simulator:
    build: { context: ., dockerfile: Dockerfile }
    image: aegis/aegis:local
    command: ["aegis-simulator"]
    environment:
      <<: *aegis-env
      AEGIS_SIMULATOR_PORT: "8601"
      AEGIS_SIMULATOR_SEED: ${AEGIS_SIMULATOR_SEED:-42}
      AEGIS_LLM_PROVIDER: disabled
    ports: ["8601:8601"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8601/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: aegis/aegis:local
    build: { context: ., dockerfile: Dockerfile }
    command: ["aegis", "migrate"]
    environment:
      <<: *aegis-env
      AEGIS_LLM_PROVIDER: disabled
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: aegis/aegis:local
    build: { context: ., dockerfile: Dockerfile }
    command: ["aegis-api"]
    environment:
      <<: *aegis-env
      AEGIS_API_PORT: "8600"
    secrets: [openai_api_key]
    ports: ["8600:8600"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_healthy }
      simulator: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8600/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    image: aegis/aegis:local
    build: { context: ., dockerfile: Dockerfile }
    command: ["aegis-worker"]
    environment:
      <<: *aegis-env
      AEGIS_METRICS_PORT: "9464"
    secrets: [openai_api_key]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_healthy }
      simulator: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9464/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 45s

  detector:
    image: aegis/aegis:local
    build: { context: ., dockerfile: Dockerfile }
    command: ["aegis-detector"]
    environment:
      <<: *aegis-env
      AEGIS_METRICS_PORT: "9465"
      AEGIS_LLM_PROVIDER: disabled
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_healthy }
      simulator: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9465/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    # NEXT_PUBLIC_* values are inlined by Next at build time, so they are build args, not env.
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AEGIS_API_URL: ${NEXT_PUBLIC_AEGIS_API_URL:-http://localhost:8600}
        NEXT_PUBLIC_AEGIS_API_KEY: ${NEXT_PUBLIC_AEGIS_API_KEY:-}
        NEXT_PUBLIC_TEMPORAL_UI_URL: ${NEXT_PUBLIC_TEMPORAL_UI_URL:-http://localhost:8233}
        NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL:-http://localhost:3000}
        NEXT_PUBLIC_PROMETHEUS_URL: ${NEXT_PUBLIC_PROMETHEUS_URL:-http://localhost:9090}
    image: aegis/web:local
    ports: ["3600:3000"]
    depends_on:
      api: { condition: service_healthy }

  # ---- observability profile ----------------------------------------------------------------
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.0.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d",
              "--web.enable-remote-write-receiver"]
    volumes: ["./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro",
              "prometheus-data:/prometheus"]
    ports: ["9090:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana-oss:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aegis
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: ["./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro",
              "grafana-data:/var/lib/grafana"]
    ports: ["3000:3000"]
    depends_on: [prometheus]

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes: ["./infrastructure/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro", "tempo-data:/var/tempo"]
    ports: ["3200:3200"]

  loki:
    profiles: [observability]
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["./infrastructure/loki/loki.yaml:/etc/loki/local-config.yaml:ro", "loki-data:/loki"]
    ports: ["3100:3100"]

  promtail:
    profiles: [observability]
    image: grafana/promtail:3.3.2
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes: ["./infrastructure/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro",
              "/var/run/docker.sock:/var/run/docker.sock:ro"]
    depends_on: [loki]

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./infrastructure/otel/collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [tempo, prometheus]

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
