global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: aegis-api
    static_configs: [{ targets: ["api:8600"], labels: { component: api } }]
  - job_name: aegis-worker
    static_configs: [{ targets: ["worker:9464"], labels: { component: worker } }]
  - job_name: aegis-detector
    static_configs: [{ targets: ["detector:9465"], labels: { component: detector } }]
  - job_name: simulated-infrastructure
    static_configs: [{ targets: ["simulator:8601"], labels: { component: simulator } }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
